<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveCalculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style="color: red;">Love Calculator❤️</h1>
        <br>
        <form id="loveForm" autocomplete="off">
            <label for="BoyName">Boy Name:</label>
            <input type="text" id="BoyName" placeholder="Enter Boy Name" required>
            <br>

            <label for="GirlName">Girl Name:</label>
            <input type="text" id="GirlName" placeholder="Enter Girl Name" required>
            <br>
            <button type="submit">Calculate Love</button>
        </form>
        <br>
        <h2 id="result">Result:</h2>
        <h1 id="answer">Ans</h1>
    </div>
</body>
<script src="script.js"></script>
</html>
