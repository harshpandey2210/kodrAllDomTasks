<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncomeTaxCalculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body >
    <div id="tax">
        <form id="form" autocomplete="off">
            <label for="income">Income:</label>
            <input type="number" id="income" placeholder="Enter Your Income" required>
            <br><br>
            <button type="submit" style="background-color:rgb(157, 238, 157)">Calculate Tax</button>
        </form>
        <br><br>
        <h3 id="result">Your Tax Amount:</h3>
    </div>
</body>
<script src="script.js"></script>
</html>
